name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sahrbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sahrbot_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/sahrbot_test?sslmode=disable
      TELEGRAM_BOT_TOKEN: test-token-not-used
      OPENAI_API_KEY: test-key-not-used

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Unit tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Migrate clean PostgreSQL
        run: go run ./cmd/migrate
      - name: Import question bank twice
        run: |
          go run ./cmd/import-questions -file materials/question_bank.csv
          go run ./cmd/import-questions -file materials/question_bank.csv
