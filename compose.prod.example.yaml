services:
  postgres:
    image: postgres:16-alpine
    container_name: sa-hr-postgres
    env_file: prod.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-sahrbot}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  bot:
    build: .
    container_name: sa-hr-bot
    env_file: prod.env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 110s

  tools:
    image: golang:1.25-alpine
    working_dir: /src
    env_file: prod.env
    volumes:
      - .:/src
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  postgres-data:
